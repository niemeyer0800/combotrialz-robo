name: Robô ComboTrialz

on:
  schedule:
    - cron: '*/5 * * * *'    # a cada 5 min, o mínimo do GitHub (pode atrasar alguns minutos)
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora
  push:
    paths: ['relatorios/**'] # chegou relatório de combos do Claude: importa na hora

permissions:
  contents: write            # para salvar estado/estado.json e o "mantém ativo"

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node robo.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HORAS_ENTRE_BUSCAS: ${{ vars.HORAS_ENTRE_BUSCAS }}
          BUSCA_GEMINI: ${{ vars.BUSCA_GEMINI }}

      # estado/estado.json: o que já existe na base, lido pela pesquisa do Claude
      - name: Salva o estado da base
        if: always()
        run: |
          git config user.name "robo-combotrialz"
          git config user.email "robo@users.noreply.github.com"
          git add estado/estado.json 2>/dev/null || exit 0
          if ! git diff --cached --quiet; then
            git commit -m "estado da base"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      # O GitHub desliga agendamentos de repositórios sem commits há 60 dias.
      # Uma vez por mês o robô faz um commit vazio para continuar ligado.
      - name: Mantém o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "mantém o robô ativo"
            git push
          fi
