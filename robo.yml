name: Robô ComboTrialz

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora

permissions:
  contents: write            # só para o "mantém ativo" abaixo

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node robo.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HORAS_ENTRE_BUSCAS: ${{ vars.HORAS_ENTRE_BUSCAS }}

      # O GitHub desliga agendamentos de repositórios sem commits há 60 dias.
      # Uma vez por mês o robô faz um commit vazio para continuar ligado.
      - name: Mantém o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "robo-combotrialz"
            git config user.email "robo@users.noreply.github.com"
            git commit --allow-empty -m "mantém o robô ativo"
            git push
          fi
